name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure

      # reads and validates the changelog (the last ten versions) as the release does
      - name: Validate the changelog
        uses: dcotecnologia/keepmeachangelog-action@v1
        with:
          validation_depth: 10
          version: Unreleased
          path: ./CHANGELOG.md

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # PyGObject and GTK come from the system, as on the desktop
      - name: Install GTK bindings
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-gi gir1.2-gtk-3.0

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv venv --system-site-packages --python /usr/bin/python3
          uv sync --extra dev --frozen

      - name: Run tests
        run: uv run pytest -q
