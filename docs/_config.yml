title: Spotlight for Linux
tagline: A Spotlight-style launcher for Linux
description: A free Spotlight-style launcher for Linux. Press Super+Space to open apps, find files and do quick math from one search box. One-command install.

# The address of the site: the canonical URLs, the sitemap and the social cards use it
url: https://dcotecnologia.github.io
baseurl: /spotlight-linux
lang: en
locale: en_US

app_name: Spotlight for Linux
app_icon: assets/icon.png
app_screenshot: screenshots/apps.png
app_screenshot_alt: The launcher searching for an application
social_image: assets/og.png
social_image_alt: Spotlight for Linux, a search box that opens apps, finds files and does math
app_description: A Spotlight-style launcher for Linux. Press Super+Space, type, and open an app, find a file or get the result of a calculation, without leaving the keyboard. Free, open source and installed with one command.

# Google Tag Manager container (GTM-XXXXXXX); empty leaves the tag out of the pages
google_tag_manager_id: ""
# Google Analytics 4 measurement ID (G-XXXXXXXXXX); empty leaves the tag out of the pages
google_analytics_id: ""

repo_url: https://github.com/dcotecnologia/spotlight-linux
install_command: curl -fsSL https://raw.githubusercontent.com/dcotecnologia/spotlight-linux/main/install.sh | sh
company_name: DCO Tecnologia
company_url: https://dcotecnologia.com
x_handle: dcotecnologia
social:
  - name: X
    url: https://x.com/dcotecnologia
    icon: x
  - name: Instagram
    url: https://www.instagram.com/dcotecnologia/
    icon: instagram
  - name: Facebook
    url: https://www.facebook.com/dcotecnologia/
    icon: facebook
  - name: LinkedIn
    url: https://www.linkedin.com/company/86377820/
    icon: linkedin

nav:
  - title: Install
    url: /install/
  - title: Tutorial
    url: /tutorial/
  - title: Docs
    url: /documentation/
  - title: Source
    url: https://github.com/dcotecnologia/spotlight-linux

features:
  - icon: "⌕"
    title: Apps in a keystroke
    description: Type a few letters and press Enter. Applications are ranked by name, then by generic name and keywords, with their icons.
  - icon: "="
    title: A calculator built in
    description: Type 2*(3+4)^2 or sqrt(16) and Enter copies the result. It never runs your text as code.
  - icon: "▤"
    title: Files from your home
    description: Searches your home folder through plocate, skipping hidden folders, and opens the file with its default application.
  - icon: "☁"
    title: Web search
    description: The last row sends what you typed to your browser, so there is always something to press Enter on.
  - icon: "⌨"
    title: One shortcut
    description: Super+Space opens and closes it. Ctrl+1 to Ctrl+9 run a row directly, Esc or a click outside closes it.
  - icon: "✓"
    title: Private and light
    description: One Python file with GTK 3. No telemetry, no history, no network of its own. Installed with a script that checks the sha256 of the download.

exclude:
  - README.md
  # the sources of the Tutorial and Documentation pages, which include them
  - DOCUMENTATION.md
  - TUTORIAL.md

plugins:
  - jekyll-sitemap

sass:
  style: compressed
